<!doctype html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Urr Memory</title><style>body{background:#10131b;color:white;font:18px Arial;padding:24px}h1{color:#b7a1ff}input,button,textarea{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:10px}input,textarea{background:#202532;color:white;border:1px solid #555}button{background:#7960d9;color:white;border:0}#chat{white-space:pre-wrap;padding:12px;background:#202532;border-radius:10px}</style></head><body><h1>Urr Memory</h1><p>तुम्हारा personal assistant</p><div id="chat">नमस्ते! Urr Memory में आपका स्वागत है।</div><input id="msg" placeholder="अपना मैसेज लिखो"><button onclick="send()">Send</button><textarea id="mem" placeholder="अपनी याद यहाँ लिखो"></textarea><button onclick="save()">याद सेव करो</button><p id="status"></p><script>function send(){let x=document.getElementById("msg"),c=document.getElementById("chat");if(x.value.trim()){c.textContent+="\n\nतुम: "+x.value+"\nUrr Memory: यह demo है; असली AI अभी जुड़ा नहीं है।";x.value=""}}function save(){try{localStorage.setItem("urrMemory",document.getElementById("mem").value);document.getElementById("status").textContent="याद सेव हो गई।"}catch(e){document.getElementById("status").textContent="सेव नहीं हो पाया।"}}try{document.getElementById("mem").value=localStorage.getItem("urrMemory")||""}catch(e){}</script></body></html>
